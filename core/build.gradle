plugins {
    id 'java'
    id 'maven-publish'
}

group = 'yorickbm.skyblockaddon.core'
version = '8.0'
archivesBaseName = 'SkyBlockAddon-Core'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson dependency
    implementation 'com.google.code.gson:gson:2.10.1' // latest stable version

    //Google cache dependency
    implementation 'com.google.guava:guava:32.1.2-jre' // latest stable version

    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.1'

    // JUnit for testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = project.archivesBaseName
            version = project.version
        }
    }
}
