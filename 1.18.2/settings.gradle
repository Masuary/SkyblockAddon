pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'skyblockaddon'

includeBuild('../core') {
    dependencySubstitution {
        substitute module('yorickbm.skyblockaddon.core:SkyBlockAddon-Core') using project(':')
    }
}
